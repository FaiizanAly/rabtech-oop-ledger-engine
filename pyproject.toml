[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-engine"
version = "0.1.0"
description = "Object-oriented Banking Ledger Data Management Engine demonstrating OOP, custom exceptions, core algorithms, and JSON/CSV persistence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Faizan Ali", email = "git.faizanali@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=ledger_engine --cov-report=term-missing"
